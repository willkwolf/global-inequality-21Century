# GitHub Pages Jekyll Configuration
# Excluir explícitamente archivos de configuración interna, repositorios y dotfiles de la exposición pública

exclude:
  - .gitignore
  - .git
  - .github
  - .vscode
  - .idea
  - node_modules
  - package.json
  - package-lock.json
  - tsconfig.json
  - tests
  - src
  - artifacts
  - OpenWiki

# Opciones de procesamiento de plugins
plugins: []
markdown: kramdown
